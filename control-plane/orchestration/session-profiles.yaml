# How a worker session STARTS — as opposed to where its work goes.
#
# The dispatch command line (repo, branch, worktree, host) varies per run and
# is spelled by the lead at dispatch time. This file holds the other half: the
# settings that shape the agent itself, which do not vary per run.
#
# A profile of your own goes in the gitignored `session-profiles.local.yaml`
# beside this file, same schema; it replaces the profile of the same name here
# WHOLE. Do not edit this file to tune a worker.

# The default worker: full hook coverage (thurbox's built-in hooks extension
# wires status reporting through the agent's own settings), no model pin —
# the agent's own default. `env` entries become THURBOX_* environment facts
# the worker's scripts can read.
profiles:
  worker:
    agent: claude
    env:
      TALOS_PROFILE: worker

  # The spec writers: same shape, named so the lead can address them
  # separately in `session create --agent <name>`.
  spec-writer:
    agent: claude
    env:
      TALOS_PROFILE: spec-writer
